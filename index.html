<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Event Horizon — Daily Intelligence Dispatch</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ['Lora', 'Georgia', 'serif'],
              sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              editorial: {
                paper: '#F4EFE6',
                card: '#FAF7F1',
                inset: '#ECE5D8',
                ink: '#231B15',
                muted: '#6E6256',
                faint: '#9B8E80',
                rule: '#DFD6C7',
                sienna: '#A94424',
                'sienna-deep': '#8B3218',
                sage: '#52664A',
                lapis: '#2B4C7E',
              }
            },
            boxShadow: {
              'editorial': '0 2px 12px -2px rgba(35, 27, 21, 0.06)',
              'editorial-lift': '0 8px 24px -6px rgba(35, 27, 21, 0.12)',
            }
          }
        }
      }
    </script>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        background-color: #F4EFE6;
        color: #231B15;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }
      .tabular-nums {
        font-variant-numeric: tabular-nums;
      }
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .pb-safe {
        padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
